<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the canvas reach under the notch,
         Dynamic Island and home indicator; without it iOS letterboxes the page.
         maximum-scale + user-scalable=no stop a double-tap zooming the
         viewfinder, which no camera app should ever do. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="See how the world looks to someone who needs glasses." />
    <!-- Added to Home Screen: run with no browser chrome. black-translucent
         lets our black canvas sit under the status bar, which combined with the
         safe-area insets gives the full-bleed camera-app look. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vision Sim" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Vision Sim</title>
    <!-- Inlined deliberately: this is the fallback shown when the stylesheet
         itself fails to load, so it cannot live in the stylesheet. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .boot-inner {
        max-width: 300px;
      }
      .boot h1 {
        font-size: 19px;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      .boot p {
        font-size: 14px;
        line-height: 1.5;
        margin: 0;
        opacity: 0.6;
      }
      .boot-eye {
        width: 46px;
        height: 46px;
        margin: 0 auto 16px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced wholesale by React on mount. If the bundle never arrives,
           this stays on screen and turns into a connection hint rather than
           leaving the user staring at a black rectangle. -->
      <div class="boot">
        <div class="boot-inner">
          <svg class="boot-eye" viewBox="0 0 64 64" aria-hidden="true">
            <path
              d="M4 32c6-11 15-17 28-17s22 6 28 17c-6 11-15 17-28 17S10 43 4 32z"
              fill="none"
              stroke="#6ee7ff"
              stroke-width="3.5"
              stroke-linecap="round"
            />
            <circle cx="32" cy="32" r="7.5" fill="#6ee7ff" />
          </svg>
          <h1>Vision Sim</h1>
          <p id="boot-msg">Starting…</p>
        </div>
      </div>
    </div>
    <script>
      // If React has not taken over the root after a few seconds, the bundle is
      // missing or stalled. Say something useful instead of hanging on
      // "Starting...". Cleared automatically when React replaces #root.
      (function () {
        var t = setTimeout(function () {
          var msg = document.getElementById('boot-msg')
          if (!msg) return
          msg.textContent = navigator.onLine
            ? 'Still loading. If this does not clear, reload the page.'
            : 'You appear to be offline. Reconnect and reload to start Vision Sim.'
        }, 6000)
        window.addEventListener('pageshow', function () {
          if (!document.getElementById('boot-msg')) clearTimeout(t)
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
